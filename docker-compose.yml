version: "3.9"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

  backend:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - mongo
    env_file:
      - .env
    environment:
      # Public URL for media links stored in MongoDB (override in .env if needed)
      BASE_URL: https://aniketpatil.xyz
    volumes:
      - ./storage:/app/storage

    networks:
      - app-network

volumes:
  mongo-data:

networks:
  app-network: