version: "3.9"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      PORT: "8000"
      MONGODB_URI: "mongodb://mongo:27017/goal_tracker"

      AUTH_SIGNUP_PASSWORD: "change_this"
      JWT_SECRET: "super_secret"

      JWT_ISSUER: "goal-tracker"
      JWT_AUDIENCE: "goal-tracker"

      UPLOAD_DIR: "/app/storage"

      BASE_URL: "https://api.example.com"

    volumes:
      - ./storage:/app/storage

    networks:
      - app-network

volumes:
  mongo-data:

networks:
  app-network: